name: Build GH-Elo

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC
  workflow_dispatch:       # permite lanzarlo manualmente

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build GH-Elo
        run: python build_gh_elo.py

      - name: Commit elo_state.json
        run: |
          git config user.name "gh-elo-bot"
          git config user.email "gh-elo-bot@users.noreply.github.com"
          git add elo_state.json
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Update elo_state.json $(date -u +%Y-%m-%d)"
            git push
          fi
